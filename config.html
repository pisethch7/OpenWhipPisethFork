<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OpenWhip — Phrases</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }
  body {
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #111111;
    margin: 0;
    padding: 24px;
    user-select: none;
  }
  h2 { margin: 0 0 5px 0; font-size: 20px; font-weight: 700; letter-spacing: 0; }
  .hint { color: #5f6368; font-size: 12px; line-height: 1.5; margin: 0 0 18px 0; }
  .row { display: flex; gap: 9px; margin-bottom: 14px; }
  #phrase-input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    background: #ffffff;
    color: #111111;
    border: 1px solid #cfd3d8;
    border-radius: 6px;
    font: 500 13px "Poppins", sans-serif;
    outline: none;
  }
  #phrase-input::placeholder { color: #8b9198; }
  #phrase-input:focus { border-color: #111111; box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.1); }
  button {
    padding: 10px 15px;
    background: #111111;
    color: #fff;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font: 600 13px "Poppins", sans-serif;
    transition: background 120ms ease, transform 120ms ease;
  }
  button:hover { background: #343434; }
  button:active { transform: translateY(1px); }
  button.ghost { background: #ffffff; color: #5f6368; border: 1px solid #d9dde1; padding: 7px 10px; }
  button.ghost:hover { background: #fff1f1; color: #b42318; border-color: #f0b8b5; }
  #list {
    list-style: none;
    padding: 0;
    margin: 0 0 16px 0;
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #dfe2e5;
    border-radius: 6px;
    background: #fafafa;
  }
  #list li {
    padding: 9px 12px;
    border-bottom: 1px solid #e8eaed;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  #list li:last-child { border-bottom: 0; }
  #list li span {
    flex: 1;
    word-break: break-word;
    user-select: text;
  }
  #list li.empty {
    color: #72777d;
    font-style: italic;
    justify-content: center;
  }
  #start {
    width: 100%;
    padding: 13px;
    background: #d92d20;
    font-size: 14px;
    font-weight: 700;
  }
  #start:hover { background: #b42318; }
  #start:disabled {
    background: #c5c9ce;
    color: #ffffff;
    cursor: not-allowed;
  }
  .footer {
    margin-top: 12px;
    font-size: 11px;
    color: #72777d;
    text-align: center;
  }
</style>
</head>
<body>
  <h2>OpenWhip phrases</h2>
  <p class="hint">One of these is typed (after Ctrl+C) each time you crack the whip.</p>

  <div class="row">
    <input id="phrase-input" placeholder="e.g. HURRY UP" maxlength="200" />
    <button id="add">Add</button>
  </div>

  <ul id="list"></ul>

  <button id="start">Start Whipping</button>
  <div class="footer">Click tray icon → whip appears. Click to drop it.</div>

<script>
  const listEl = document.getElementById('list');
  const input = document.getElementById('phrase-input');
  const addBtn = document.getElementById('add');
  const startBtn = document.getElementById('start');
  let phrases = [];

  function render() {
    listEl.innerHTML = '';
    if (phrases.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No phrases yet — add at least one to start.';
      listEl.appendChild(li);
    } else {
      phrases.forEach((p, i) => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = p;
        const btn = document.createElement('button');
        btn.textContent = 'Remove';
        btn.className = 'ghost';
        btn.onclick = () => {
          phrases.splice(i, 1);
          window.bridge.savePhrases(phrases);
          render();
        };
        li.appendChild(span);
        li.appendChild(btn);
        listEl.appendChild(li);
      });
    }
    startBtn.disabled = phrases.length === 0;
  }

  addBtn.onclick = () => {
    const v = input.value.trim();
    if (!v) return;
    phrases.push(v);
    input.value = '';
    window.bridge.savePhrases(phrases);
    render();
    input.focus();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
  });

  startBtn.onclick = () => {
    if (phrases.length === 0) return;
    window.bridge.savePhrases(phrases);
    window.bridge.startWhipping();
  };

  window.bridge.getPhrases().then(p => {
    phrases = Array.isArray(p) ? p.slice() : [];
    render();
    input.focus();
  });
</script>
</body>
</html>
